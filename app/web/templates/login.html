<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><title>登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif}
.login-card{background:#16213e;padding:40px;border-radius:12px;width:360px;box-shadow:0 8px 32px rgba(0,0,0,0.5)}
.login-card h1{color:#e0e0e0;text-align:center;margin-bottom:8px}
.login-card .sub{color:#aaa;text-align:center;margin-bottom:30px}
.login-card input{width:100%;padding:12px 16px;margin-bottom:16px;border:none;border-radius:6px;background:#0f3460;color:#fff;font-size:15px}
.login-card input:focus{outline:2px solid #e94560}
.login-card button{width:100%;padding:12px;border:none;border-radius:6px;background:#e94560;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.login-card button:hover{background:#c73652}
.error{color:#ff6b6b;text-align:center;margin-bottom:12px}
</style>
</head>
<body>
<div class="login-card">
<h1>🔐 Business Bot</h1><p class="sub">管理后台</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="POST">
<input type="text" name="username" placeholder="用户名" required>
<input type="password" name="password" placeholder="密码" required>
<button type="submit">登 录</button>
</form>
</div>
</body>
</html>
